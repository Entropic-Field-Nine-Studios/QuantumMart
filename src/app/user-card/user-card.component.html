<mat-card class="user-card">
  <mat-card-header>
    <button mat-card-avatar class="avatar-btn clickable" (click)="navigateProfile()">
      <img src="assets/pfp/msn-avatar.png" class="avatar-img" alt="My Profile" />
    </button>

    <mat-card-title class="clickable" (click)="navigateProfile()">
      {{ user.username }}
    </mat-card-title>

    <mat-card-title class="clickable" (click)="navigateProfile()">
      Balance: {{ user.balance | currency }}
    </mat-card-title>

    <mat-card-subtitle>
      <button matIconButton class="clickable" (click)="logout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-card-subtitle>
  </mat-card-header>
</mat-card>
