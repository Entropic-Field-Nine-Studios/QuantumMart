@if (notFound()) {
  <app-not-found></app-not-found>
} @else if (userInfo === null) {
  <mat-spinner></mat-spinner>
} @else {
  <div class="profile-container">
    <div class="profile-card">
      <div class="identity">
        <div class="avatar">
          {{ userInfo.username[0] | uppercase }}
        </div>

        <div class="username">
          {{ userInfo.username }}
        </div>

        @if (isStaff()) {
          <div class="role-card">STAFF</div>
        }
      </div>

      <div class="details">
        @if (userInfo.email.length > 0) {
          <div class="detail-row">
            <span class="label">Email</span>
            <span class="value">{{ userInfo.email }}</span>
          </div>
        }

        <div class="detail-row">
          <span class="label">User ID</span>

          <div class="value-row">
            <span class="value mono">{{ userInfo.id }}</span>

            <button class="copy-btn" (click)="copyId(userInfo.id)">Copy</button>
          </div>
        </div>

        <div class="detail-row">
          <span class="label">Joined</span>
          <span class="value">{{ userInfo.createdAt | date: 'mediumDate' }}</span>
        </div>
      </div>
    </div>
  </div>
}
